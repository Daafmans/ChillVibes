<svg xmlns="http://www.w3.org/2000/svg" width="44" height="44" viewBox="0 0 44 44">
  <!-- Ruins map icon: broken columns on a cracked plinth, a fallen drum and rubble. Centred on a 44x44 tile. -->
  <!-- intact column with capital -->
  <rect x="12" y="14" width="4" height="15" fill="#cfc6b3"/>
  <rect x="14.8" y="14" width="1.2" height="15" fill="#a39a87"/>
  <rect x="10.5" y="12" width="7" height="2" fill="#e0d8c6"/>
  <!-- short broken column -->
  <rect x="20" y="22" width="4" height="7" fill="#cfc6b3"/>
  <rect x="22.8" y="22" width="1.2" height="7" fill="#a39a87"/>
  <polygon points="20,22 21.2,20 22,21.5 23,19.5 24,22" fill="#cfc6b3"/>
  <!-- tall broken column -->
  <rect x="28" y="18" width="4" height="11" fill="#cfc6b3"/>
  <rect x="30.8" y="18" width="1.2" height="11" fill="#a39a87"/>
  <polygon points="28,18 29.2,17 30,15 31,17.5 32,18" fill="#cfc6b3"/>
  <!-- cracked plinth -->
  <rect x="10" y="29" width="10" height="3" fill="#8a8172"/>
  <rect x="21" y="29" width="13" height="3" fill="#8a8172"/>
  <!-- fallen column drum -->
  <rect x="-2" y="-2" width="7" height="3.5" fill="#bdb39e" transform="translate(28 28) rotate(-14.3)"/>
  <!-- rubble -->
  <rect x="18" y="27.5" width="2" height="1.5" fill="#a39a87"/>
  <rect x="34" y="30" width="2" height="2" fill="#a39a87"/>
  <rect x="8" y="30.5" width="1.5" height="1.5" fill="#a39a87"/>
</svg>
